name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: "9.3.1"

    - name: Ensure Debug Keystore Exists
      run: |
        if [ -f "debug.keystore.base64" ]; then
          echo "Decoding debug.keystore.base64..."
          base64 -d debug.keystore.base64 > debug.keystore
        elif [ -f "debug.keystore" ]; then
          echo "debug.keystore already exists."
        else
          echo "No debug.keystore found. Generating compatible debug.keystore..."
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Build with Gradle
      run: |
        gradle assembleDebug -Pkotlin.compiler.execution.strategy=daemon --no-parallel --no-configuration-cache

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Wifi-Share-Pro-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
